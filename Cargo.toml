[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "src-tauri"]

[workspace.package]
version = "0.2.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tickernelz/proview-cctv-web"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time", "process"] }
thiserror = "2"
async-trait = "0.1"
md-5 = "0.10"
aes = "0.8"
rand = "0.8"
bytes = "1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
