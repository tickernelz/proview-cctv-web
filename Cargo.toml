[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/tickernelz/proview-cctv-web"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
thiserror = "2"
async-trait = "0.1"
md-5 = "0.10"
rand = "0.8"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
