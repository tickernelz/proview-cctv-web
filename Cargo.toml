[package]
name = "proview-cctv-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rocket web front-end for PROVIEW/XMEye CCTV devices"
license = "MIT"

[dependencies]
rocket = { version = "0.5.1", features = ["json", "secrets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
async-trait = "0.1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
