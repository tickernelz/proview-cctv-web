name: mobile-re-accel

on:
  push:
    branches:
      - fix/zha3926-mobile-emulator-boot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accel:
    name: hypervisor availability and a direct emulator launch
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Hypervisor facts
        run: |
          set -x
          uname -m
          sysctl kern.hv_support || true
          sysctl -n hw.optional.arm.FEAT_EL2 2>/dev/null || true
          "${ANDROID_HOME}/emulator/emulator" -accel-check || true

      - name: Install the image and create an AVD
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "${SDKMANAGER}" --install "system-images;android-33;google_apis;arm64-v8a" > /dev/null
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --force -n probe --package "system-images;android-33;google_apis;arm64-v8a" --device pixel
          grep -E "abi|image|tag|ramSize|ncore" "${ANDROID_AVD_HOME:-$HOME/.android/avd}/probe.avd/config.ini" || true

      - name: Run the emulator for 120 seconds and capture its output
        run: |
          set -uo pipefail
          "${ANDROID_HOME}/emulator/emulator" -port 5554 -avd probe -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          EMU=$!
          echo "emulator pid $EMU"
          for i in $(seq 1 12); do
            sleep 10
            printf '== %ss\n' "$((i*10))"
            adb devices -l 2>&1
            kill -0 $EMU 2>/dev/null || { echo "emulator exited"; break; }
          done
          echo "=== emulator.log"
          cat emulator.log
          echo "=== boot completed"
          adb -s emulator-5554 shell getprop sys.boot_completed 2>&1 || true
          kill $EMU 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accel-${{ github.run_id }}
          path: emulator.log
          if-no-files-found: warn
