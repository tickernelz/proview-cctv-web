name: mobile-re-accel

on:
  push:
    paths:
      - .github/workflows/mobile-re-accel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcg:
    name: qemu tcg accelerator on an arm64 image
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Install the image and create an AVD
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -1)
          set +o pipefail
          yes | "${SDKMANAGER}" --install "system-images;android-33;google_apis;arm64-v8a" > /dev/null
          set -o pipefail
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --force -n probe --package "system-images;android-33;google_apis;arm64-v8a" --device pixel

      - name: Run with -qemu -accel tcg
        run: |
          ADB="${ANDROID_HOME}/platform-tools/adb"
          "${ANDROID_HOME}/emulator/emulator" -port 5554 -avd probe -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel off -qemu -accel tcg > tcg.log 2>&1 &
          EMU=$!
          for i in $(seq 1 24); do
            sleep 5
            kill -0 $EMU 2>/dev/null || { echo "emulator exited after $((i*5))s"; break; }
            if "${ADB}" -s emulator-5554 get-state 2>/dev/null | grep -q device; then echo "device up after $((i*5))s"; break; fi
          done
          echo "=== tcg.log tail"
          tail -12 tcg.log
          echo "=== tcg.log errors"
          grep -nE "HVF|tcg|TCG|ERROR|FATAL|accelerator|panic" tcg.log | head -20 || true
          "${ADB}" devices -l || true
          kill $EMU 2>/dev/null || true
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcg-${{ github.run_id }}
          path: "*.log"
          if-no-files-found: warn
