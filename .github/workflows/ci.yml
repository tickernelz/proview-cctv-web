name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the web app
        working-directory: apps/web
        run: |
          npm ci --include=dev
          npm run build
      - name: Contrast of every token pair
        run: python3 tools/contrast.py
      - run: cargo fmt --all --check
      - run: cargo clippy -p proview-core -p proview-server --all-targets -- -D warnings
      - run: cargo test -p proview-core -p proview-server
      - name: Web UI in headless Chrome (menus, shortcuts, talk, grid, snapshot, settings edits during boot, boot stream ownership, misconfigured headline)
        run: |
          cargo build -p proview-server
          timeout 600 node --test tests/web/ui.test.mjs tests/web/grid.test.mjs tests/web/snapshot.test.mjs tests/web/device-settings.test.mjs tests/web/alarms-pictures.test.mjs tests/web/restart.test.mjs tests/web/settings-boot.test.mjs tests/web/desktop-settings.test.mjs tests/web/stream-orphan.test.mjs tests/web/stream-misconfigured.test.mjs
      - run: cargo build --release -p proview-server

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      CI: '1'
      OPENSSL_NO_VENDOR: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config libssl-dev curl ca-certificates >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            e2e/package-lock.json
      - name: Build the web app
        working-directory: apps/web
        run: |
          npm ci --include=dev
          npm run build
      - run: cargo build -p proview-server
      - name: Install the e2e harness
        working-directory: e2e
        run: npm ci --include=dev
      - name: e2e (Chromium and WebKit, fixture servers)
        working-directory: e2e
        run: npx --no-install playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the web app
        working-directory: apps/web
        run: |
          npm ci --include=dev
          npm run build
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Lint the desktop crate
        if: runner.os == 'Linux'
        run: cargo clippy -p proview-desktop --all-targets -- -D warnings
      - name: Test the desktop crate
        if: runner.os == 'Linux'
        run: cargo test -p proview-desktop
      - name: Strawberry Perl and NASM for the vendored OpenSSL build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Strawberry\perl\bin\perl.exe')) { choco install strawberryperl -y --no-progress }
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "OPENSSL_SRC_PERL=C:\\Strawberry\\perl\\bin\\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build desktop shell
        run: cargo build -p proview-desktop
