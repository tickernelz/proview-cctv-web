name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.target }}

      - name: Build with cross (linux alternative architectures)
        if: matrix.use_cross
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--release -p proview-server"
          strip: true

      - name: Build with cargo (native runners)
        if: ${{ !matrix.use_cross }}
        shell: bash
        run: |
          rustup target add ${{ matrix.target }} || true
          cargo build --release -p proview-server --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          mkdir -p dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bin="target/${target}/release/proview-server.exe"
            out="dist/proview-server-${target}.zip"
            7z a "$out" "$bin" > /dev/null
          else
            bin="target/${target}/release/proview-server"
            out="dist/proview-server-${target}.tar.gz"
            tar -czf "$out" -C "$(dirname "$bin")" "$(basename "$bin")"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
            args: ''
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            args: ''
          - label: windows-x86_64
            os: windows-latest
            args: ''
          - label: windows-aarch64
            os: windows-latest
            args: '--target aarch64-pc-windows-msvc'
          - label: macos-aarch64
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - label: macos-x86_64
            os: macos-latest
            args: '--target x86_64-apple-darwin'
          - label: macos-universal
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}

      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Add rust targets
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = "windows-aarch64" ]; then rustup target add aarch64-pc-windows-msvc; fi
          if [ "${{ matrix.label }}" = "macos-x86_64" ]; then rustup target add x86_64-apple-darwin; fi
          if [ "${{ matrix.label }}" = "macos-aarch64" ]; then rustup target add aarch64-apple-darwin; fi
          if [ "${{ matrix.label }}" = "macos-universal" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - name: Install tauri cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build bundles
        shell: bash
        run: cargo tauri build ${{ matrix.args }}

      - name: Sign Windows installers when a certificate secret exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host 'SIGNING: skipped, no certificate secret configured'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))

          $files = Get-ChildItem -Path target -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' -and $_.FullName -like '*bundle*' }
          if (-not $files) { Write-Host 'SIGNING: no installers found to sign'; exit 1 }
          Write-Host "SIGNING: candidates $($files.Count)"

          $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $tool) {
            $roots = @(
              (Join-Path "${env:ProgramFiles(x86)}" 'Windows Kits\10\bin'),
              (Join-Path $env:ProgramFiles 'Windows Kits\10\bin')
            )
            $found = @()
            foreach ($root in $roots) {
              if (Test-Path $root) {
                $found += Get-ChildItem -Path $root -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\x64\\' }
              }
            }
            if ($found.Count -gt 0) { $tool = $found[-1] }
          }
          if (-not $tool) { Write-Host 'SIGNING: signtool.exe not found'; exit 1 }

          $toolPath = if ($tool.PSObject.Properties.Name -contains 'Source') { $tool.Source } else { $tool.FullName }
          Write-Host "SIGNING: using $toolPath"

          $signed = 0
          foreach ($file in $files) {
            & $toolPath sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file.FullName
            if ($LASTEXITCODE -eq 0) { Write-Host "SIGNING: signed $($file.Name)"; $signed++ }
          }
          Write-Host "SIGNING: signed $signed installer(s)"
          if ($signed -eq 0) { exit 1 }

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find target -path '*bundle*' -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [server, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          for file in *; do
            normalized="${file// /.}"
            if [ "$file" != "$normalized" ]; then mv -- "$file" "$normalized"; fi
          done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('nightly-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('nightly-{0}', github.run_number) }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: artifacts/*
          generate_release_notes: true
