<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Direction C · Dinding</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#07080a;color:#e6e8ea;font:400 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.rail{position:fixed;inset:0 auto 0 0;width:54px;border-right:1px solid #17191c;display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 0}
.rail .mark{width:26px;height:26px;border:1px solid #2a2e33;border-radius:4px;display:grid;place-items:center;color:#8b9298;font-size:10px;letter-spacing:.08em}
.rail button{width:34px;height:34px;border:1px solid transparent;background:none;border-radius:4px;display:grid;place-items:center;color:#6d747c}
.rail button.on{color:#e6e8ea;border-color:#2a2e33;background:#101215}
.rail .sp{flex:1}
.wall{position:absolute;inset:34px 0 0 54px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#17191c}
.cell{position:relative;background:#000;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .tag{position:absolute;left:8px;top:8px;font-size:10px;letter-spacing:.06em;color:#c9ced4;background:rgba(7,8,10,.66);padding:3px 6px;border-radius:2px}
.cell .bar{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;gap:10px;padding:0 8px;background:linear-gradient(transparent,rgba(4,5,6,.86));font-size:10px;color:#aeb5bc}
.cell .bar b{font-weight:400;color:#e6e8ea}
.cell .bar .t{margin-left:auto;color:#7b828a}
.cell.on{outline:2px solid #5ee08c;outline-offset:-2px}
.cell.off img{filter:grayscale(1) brightness(.28)}
.cell .dead{position:absolute;inset:0;display:grid;place-items:center;color:#8b9298;font-size:11px}
.topstrip{position:absolute;left:54px;right:0;top:0;height:34px;display:flex;align-items:center;gap:14px;padding:0 10px;background:linear-gradient(rgba(4,5,6,.9),transparent);font-size:10px;color:#9aa1a8;z-index:3}
.topstrip b{font-weight:400;color:#e6e8ea;letter-spacing:.08em}
.topstrip .sp{flex:1}
svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<nav class="rail">
  <div class="mark">PV</div>
  <button class="on"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5.5" height="5.5"/><rect x="9" y="1.5" width="5.5" height="5.5"/><rect x="1.5" y="9" width="5.5" height="5.5"/><rect x="9" y="9" width="5.5" height="5.5"/></svg></button>
  <button><svg viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="10"/><circle cx="5" cy="6" r="1" fill="currentColor" stroke="none"/></svg></button>
  <button><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 1.6v2M8 12.4v2M1.6 8h2M12.4 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg></button>
  <div class="sp"></div>
  <button><svg viewBox="0 0 16 16"><path d="M8 2v8M4.5 7 8 10.5 11.5 7M2.5 13.5h11"/></svg></button>
</nav>
<div class="topstrip"><b>PROVIEW</b><span>4 cameras · 3 live · 1 offline</span><span class="sp"></span><span>21:40:12</span></div>
<div class="wall">
  <div class="cell"><img src="../img/front-door.jpg" alt=""><span class="tag">CH1 · FRONT DOOR</span><div class="bar"><b>Front door</b><span>1080p · 2.0 Mb/s</span><span class="t">live</span></div></div>
  <div class="cell"><img src="../img/garage-night.jpg" alt=""><span class="tag">CH1 · GARAGE</span><div class="bar"><b>Garage</b><span>1080p · IR</span><span class="t">live</span></div></div>
  <div class="cell on"><img src="../img/yard.jpg" alt=""><span class="tag">CH1 · BACKYARD</span><div class="bar"><b>Backyard</b><span>1080p · 2.1 Mb/s</span><span class="t">live</span></div></div>
  <div class="cell off"><img src="../img/shop.jpg" alt=""><div class="dead">NO SIGNAL · 21:12</div><span class="tag">CH1 · SHOP COUNTER</span><div class="bar"><b>Shop counter</b><span>offline</span><span class="t">21:12:04</span></div></div>
</div>
</body></html>
