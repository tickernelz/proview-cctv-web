<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Direction A · Rak</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:grid;grid-template-columns:264px 1fr;font:400 13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1c2330;background:#f3f5f8}
.rail{background:#fbfcfd;border-right:1px solid #e3e6ec;padding:18px 12px;display:flex;flex-direction:column;gap:14px}
.brandrow{display:flex;align-items:center;gap:8px;padding:0 8px 6px}
.logo{width:18px;height:18px;border-radius:4px;background:#1c2330}
.brandrow b{font:600 13px system-ui;letter-spacing:.12em;color:#3b4759}
.rail-h{font:600 11px system-ui;color:#7c8698;padding:0 8px;letter-spacing:.06em;text-transform:uppercase}
.devrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer}
.devrow.sel{background:#e8ebf0;box-shadow:inset 0 0 0 1px #d3d8e0}
.thumb{width:66px;height:37px;border-radius:5px;object-fit:cover;background:#0b0d10;flex:none}
.devmain{min-width:0;display:flex;flex-direction:column;gap:2px}
.devmain .n{font:500 13px system-ui;color:#1c2330}
.devmain .m{font:400 11px system-ui;color:#75808f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipdot{width:7px;height:7px;border-radius:50%;background:#22b06b;margin-left:auto;flex:none}
.chipdot.off{background:#b3bac6}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 8px}
.railfoot a{font:500 12px system-ui;color:#4a5666;text-decoration:none;padding:6px 0}
.content{display:flex;flex-direction:column;gap:14px;padding:22px 26px 18px;min-width:0;overflow:hidden}
.head{display:flex;align-items:center;gap:12px}
.head h1{font:600 21px/1.2 system-ui;letter-spacing:-.01em;margin:0}
.head .meta{font:400 12px system-ui;color:#6b7688}
.badge{margin-left:auto;display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:#e7f7ec;color:#15693a;font:600 12px system-ui}
.badge.rec{background:#fdeaea;color:#b3231c}
.stage{flex:1;min-height:0;border-radius:10px;background:#05070a;box-shadow:0 10px 28px rgba(16,22,35,.16),0 1px 2px rgba(16,22,35,.12);display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:contain}
.bar{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #dce1ea,0 1px 2px rgba(16,22,35,.05);font:500 13px system-ui;color:#28313f;border:0;cursor:pointer}
.pill.pri{background:#1c2330;color:#fff;box-shadow:none}
.pill.ghost{background:transparent;box-shadow:inset 0 0 0 1px #d5dbe5;color:#4a5666}
.spacer{flex:1}
.foot{font:400 11px system-ui;color:#8a94a3}
svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<aside class="rail">
  <div class="brandrow"><span class="logo"></span><b>PROVIEW</b></div>
  <div class="rail-h">Cameras</div>
  <div class="devrow sel"><img class="thumb" src="../img/gate-close.jpg" alt=""><div class="devmain"><span class="n">Gate camera</span><span class="m">channel 1 · live</span></div><span class="chipdot"></span></div>
  <div class="devrow"><img class="thumb" src="../img/front-door.jpg" alt=""><div class="devmain"><span class="n">Front door</span><span class="m">channel 1 · live</span></div><span class="chipdot"></span></div>
  <div class="devrow"><img class="thumb" src="../img/garage-night.jpg" alt=""><div class="devmain"><span class="n">Garage</span><span class="m">channel 1 · live</span></div><span class="chipdot"></span></div>
  <div class="devrow"><img class="thumb" src="../img/yard.jpg" alt=""><div class="devmain"><span class="n">Backyard</span><span class="m">channel 1 · live</span></div><span class="chipdot"></span></div>
  <div class="devrow"><img class="thumb" src="../img/shop.jpg" alt=""><div class="devmain"><span class="n">Shop counter</span><span class="m">offline · 21:12</span></div><span class="chipdot off"></span></div>
  <div class="railfoot"><a href="#">Settings</a><a href="#">Sign out</a></div>
</aside>
<main class="content">
  <div class="head"><h1>Gate camera</h1><span class="meta">Channel 1 · dual lens · 0.4 s behind</span>
    <span class="badge"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor" stroke="none"/></svg>Live</span></div>
  <div class="stage"><img src="../img/gate-close.jpg" alt=""></div>
  <div class="bar">
    <button class="pill pri"><svg viewBox="0 0 16 16"><rect x="6" y="2" width="4" height="7" rx="2"/><path d="M4 8a4 4 0 0 0 8 0M8 12v2"/></svg>Talk</button>
    <button class="pill"><svg viewBox="0 0 16 16"><path d="M3 6h2.4L8 3.4v9.2L5.4 10H3z"/><path d="M10.5 6a2.8 2.8 0 0 1 0 4"/></svg>Sound</button>
    <button class="pill"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="2" fill="currentColor" stroke="none"/></svg>Record</button>
    <button class="pill"><svg viewBox="0 0 16 16"><path d="M2 5.5h2.6l1-1.7h4.8l1 1.7H14V13H2z"/><circle cx="8" cy="9" r="2.4"/></svg>Snapshot</button>
    <span class="spacer"></span>
    <button class="pill ghost">Lens: Both</button>
    <button class="pill ghost">HD</button>
    <button class="pill ghost"><svg viewBox="0 0 16 16"><path d="M3 6V3h3M13 10v3h-3M13 6V3h-3M3 10v3h3"/></svg>Full screen</button>
  </div>
  <p class="foot">Streaming from the camera on this network. Nothing leaves this machine.</p>
</main>
</body></html>
