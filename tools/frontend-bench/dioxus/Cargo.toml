[package]
name = "bench-dioxus"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
